<!--
  CodeGraph Activity Bar Icon
  Simple monochrome SVG using currentColor for theme compatibility
  Represents: code brackets + graph nodes
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Left bracket "<" -->
  <path d="M7 6L2 12l5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket ">" -->
  <path d="M17 6l5 6-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graph nodes -->
  <circle cx="12" cy="9" r="1.5" fill="currentColor"/>
  <circle cx="10" cy="15" r="1.5" fill="currentColor"/>
  <circle cx="14" cy="15" r="1.5" fill="currentColor"/>
  <!-- Graph edges -->
  <line x1="12" y1="10.5" x2="10" y2="13.5" stroke="currentColor" stroke-width="1"/>
  <line x1="12" y1="10.5" x2="14" y2="13.5" stroke="currentColor" stroke-width="1"/>
</svg>
